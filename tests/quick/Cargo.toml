# Package manifest for the kwxRust quick test app (tests/quick).
#
# quick.wxui generates quick_mainframe.rs and quick_dlg.rs beside this file;
# quick_main.rs is hand-written and owns the application bootstrap.
#
# This is a standalone package on purpose: the repository's workspace manifest is
# a tracked file that the generation pipeline must not rewrite, so the empty
# [workspace] table keeps this manifest out of it. Build with
#   cargo check --manifest-path tests/quick/Cargo.toml
# or via build_quick.cmd in the repository root.

[package]
name = "quick"
version = "0.1.0"
edition = "2021"
description = "kwxRust quick test app generated from quick.wxui"
publish = false

[workspace]

[[bin]]
name = "quick"
path = "quick_main.rs"

[dependencies]
wx = { path = "../../wx", package = "kwxffi-sys" }
