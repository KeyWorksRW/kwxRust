# kwxRust - Rust bindings for wxWidgets via wxFFI
#
# This workspace contains:
# - samples/minimal: Port of the wxWidgets minimal sample

[workspace]
resolver = "2"
members = [
    "samples/minimal",
    "samples/preferences",
    "samples/menu",
    "samples/about",
    "samples/widgets",
    "samples/richtext",
    "samples/access",
    "samples/animate",
    "samples/archive",
    "samples/artprov",
    "samples/aui",
    "samples/calendar",
    "samples/caret",
    "samples/collpane",
    "samples/combo",
    "samples/config",
    "samples/console",
    "samples/dataview",
    "samples/dialogs",
    "samples/display",
    "samples/dnd",
    "samples/dragimag",
    "samples/drawing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KeyWorksRW/kwxRust"
description = "Rust bindings for wxWidgets via wxFFI"
keywords = ["wxwidgets", "gui", "ffi", "cross-platform"]
categories = ["gui", "api-bindings"]

[workspace.dependencies]
# Shared dependencies across crates
libc = "0.2"
