# kwxrust - Safe Rust wrappers for wxWidgets via wxFFI
#
# This crate provides safe, idiomatic Rust wrappers around the raw FFI bindings.
# It includes RAII wrappers, builder patterns, and type-safe event handling.

[package]
name = "kwxrust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust bindings to wxWidgets via wxFFI"
keywords = ["wxwidgets", "gui", "cross-platform"]
categories = ["gui", "api-bindings"]

[dependencies]
kwxrust-sys = { path = "../kwxrust-sys" }
libc.workspace = true
