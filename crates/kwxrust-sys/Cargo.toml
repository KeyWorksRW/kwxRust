# kwxrust-sys - Raw FFI bindings to wxFFI
#
# This crate provides the raw `extern "C"` declarations for calling wxFFI functions.
# It does NOT provide safe Rust wrappers - see kwxrust for that.

[package]
name = "kwxrust-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw FFI bindings to wxWidgets via wxFFI"
keywords = ["wxwidgets", "ffi", "sys", "bindings"]
categories = ["external-ffi-bindings"]
links = "wxffi"
build = "build.rs"

[dependencies]
libc.workspace = true

[build-dependencies]
cc = "1.0"
